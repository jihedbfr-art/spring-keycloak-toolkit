name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compatibility-matrix:
    name: "JDK ${{ matrix.java }} | Boot ${{ matrix.spring-boot }} | Keycloak ${{ matrix.keycloak }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "17"
            spring-boot: "3.2.5"
            keycloak: "25.0.6"
          - java: "17"
            spring-boot: "3.3.5"
            keycloak: "25.0.6"
          - java: "21"
            spring-boot: "3.3.5"
            keycloak: "26.0.0"
          - java: "21"
            spring-boot: "3.4.0"
            keycloak: "26.0.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Build and run test matrix with JaCoCo
        run: >
          mvn -B clean verify
          -Dspring-boot.version=${{ matrix.spring-boot }}
          -Dkeycloak.container.image=quay.io/keycloak/keycloak:${{ matrix.keycloak }}

      - name: Upload JaCoCo coverage report
        if: matrix.java == '17' && matrix.spring-boot == '3.2.5'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}-boot${{ matrix.spring-boot }}
          path: target/surefire-reports/
